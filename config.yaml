name: MLflow
version: "1.0.0"
slug: mlflow
description: MLflow tracking server for managing machine learning experiments, models, and artifacts
url: https://github.com/WickM/mlflow-hassio-addon
webui: "[PROTO:ssl]://[HOST]:[PORT:5000]"
arch:
  - aarch64
  - amd64
init: false
startup: services
map:
  - share
  - ssl
backup: cold
backup_exclude:
  - "**/logs"
  - "**/artifacts"
schema:
  TZ: str?
  port: int
  storage_path: str
  backend_store_uri: str
  default_artifact_root: str
  workers: int
  git_enabled: bool
  allowed_hosts: str
  cors_origins: str
options:
  TZ: Etc/UTC
  port: 5000
  storage_path: /mlflow
  backend_store_uri: sqlite:///mlflow/mlflow.db
  default_artifact_root: /mlflow/artifacts
  workers: 4
  git_enabled: false
  allowed_hosts: "*"
  cors_origins: "*"
# MLflow 3.x FastAPI security middleware (HostValidationMiddleware + CORS)
# reads MLFLOW_SERVER_ALLOWED_HOSTS / MLFLOW_SERVER_CORS_ALLOWED_ORIGINS from
# the env. The CLI flags in run.sh are kept for backwards compat but only
# affect the legacy Flask app. The defaults in Dockerfile ENV are "*" so
# HA ingress (which rewrites the Host header) can reach the UI without
# 403s. Override via the add-on Configuration tab if exposing publicly.
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: MLflow Web UI
image: ghcr.io/wickm/mlflow-hassio-addon
